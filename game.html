<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shooter 対戦 - PCM直接搬送</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1a; color: #e0e0e0;
            min-height: 100vh; padding: 12px;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none; /* prevent scroll/zoom while playing */
        }
        h1 { font-size: 1.2rem; color: #00d4aa; margin-bottom: 8px; }
        .status-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; background: #1a1a2e; border-radius: 8px;
            margin-bottom: 8px; font-size: 0.8rem; width: 100%; max-width: 400px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .status-dot.connected { background: #00d4aa; box-shadow: 0 0 4px #00d4aa; }
        .device-select { width: 100%; max-width: 400px; margin-bottom: 8px; }
        .device-select select {
            width: 100%; padding: 8px; background: #1a1a2e; color: #e0e0e0;
            border: 1px solid #333; border-radius: 6px; font-size: 0.8rem;
        }
        .score-bar {
            display: flex; justify-content: space-around; width: 100%; max-width: 400px;
            font-size: 1rem; font-weight: 700; margin-bottom: 6px;
        }
        .score-bar .you { color: #00d466; }
        .score-bar .enemy { color: #ff5050; }
        canvas.game {
            border: 2px solid #333; border-radius: 4px; background: #05050a;
            touch-action: none; image-rendering: pixelated;
            width: 100%; max-width: 400px; height: auto; aspect-ratio: 4 / 3;
        }
        .hint { font-size: 0.75rem; color: #888; margin: 6px 0; text-align: center; }
        .btn-row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 10px 16px; border: none; border-radius: 6px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: transform 0.1s; touch-action: manipulation;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-connect { background: #0f3460; color: #e0e0e0; }
        .btn-connect.connected { background: #1a3a2a; color: #00d4aa; }
        .btn-fire { background: #ff5050; color: #0f0f1a; padding: 14px 28px; font-size: 1rem; }
        .log { font-size: 0.75rem; color: #888; margin-top: 8px; max-width: 400px; text-align: center; min-height: 20px; }
    </style>
</head>
<body>
    <h1>🎮 対戦シューティング (vs CoreS3)</h1>
    <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
        <button class="btn-connect" id="btnConnect">🎤 Connect</button>
    </div>

    <div class="device-select">
        <select id="outputSelect">
            <option value="">-- Audio Output (speaker) --</option>
        </select>
    </div>

    <div class="score-bar">
        <span class="you" id="scoreYou">HP 5</span>
        <span id="stateLabel">--</span>
        <span class="enemy" id="scoreEnemy">HIT 0</span>
    </div>

    <canvas class="game" id="gameCanvas" width="320" height="240"></canvas>

    <div class="hint">HOLD+SWIPE=move / hold=charge / release=FIRE / long hold=BIG</div>

    <div class="log" id="log"></div>

    <script src="game.js"></script>
</body>
</html>
